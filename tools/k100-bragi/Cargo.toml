[package]
name = "k100-bragi"
version = "0.1.0"
edition = "2021"
description = "Bragi protocol client for the Corsair K100, used to verify the firmware recovery path"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
# usbdevfs ioctls only. Neither of hidapi's backends can reach this keyboard, so there is
# no HID dependency at all; see docs/bragi-firmware-update.md.
libc = "0.2.190"
