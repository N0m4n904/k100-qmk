#
# NXP LPC54605J512ET100 as fitted to the Corsair K100 RGB.
#
# OpenOCD 0.12 ships no config for the LPC546xx family, so this is the minimum
# that lets a probe attach and read memory. Deliberately nothing here halts,
# resets or writes the part: reading flash goes through the debug access port's
# AHB bridge and does not need the core stopped, which matters on this board
# because the application faults and the watchdog restarts it every few seconds.
# A dump therefore works straight through that loop.

transport select swd

set CHIPNAME lpc54605

# The published Cortex-M4 debug port ID. A board that answers with a different
# one is still worth dumping, so this is not asserted -- see find-swd.sh, which
# accepts any ID while it is still looking for the pins.
swd newdap $CHIPNAME cpu -expected-id 0x2ba01477

dap create $CHIPNAME.dap -chain-position $CHIPNAME.cpu
target create $CHIPNAME.cpu cortex_m -dap $CHIPNAME.dap

# Scratch SRAM for the routines OpenOCD runs on the target itself: IAP's
# parameter block when writing flash, and the CRC helper verify_image uses to
# checksum memory without reading it all back.
#
# It is real memory and OpenOCD really does execute there, so anything else
# living at that address is destroyed. A session that has put something at
# 0x20000000 -- an image to run from SRAM, say -- must therefore set
# WORK_AREA_SIZE to 0 before sourcing this file. Without a work area the
# target-side helpers are simply not used: verify_image reads the region back
# over SWD and compares on the host instead, which is slower and cannot
# disturb what it is checking.
#
# IAP needs this in main SRAM, so flash work cannot move it elsewhere; it can
# only be turned off for sessions that are not writing flash.
if {![info exists WORK_AREA_PHYS]} { set WORK_AREA_PHYS 0x20000000 }
if {![info exists WORK_AREA_SIZE]} { set WORK_AREA_SIZE 0x8000 }

$CHIPNAME.cpu configure -work-area-phys $WORK_AREA_PHYS \
                        -work-area-size $WORK_AREA_SIZE \
                        -work-area-backup 0

# Reset through the core's own AIRCR.SYSRESETREQ, so no reset line has to be
# wired to use "reset halt".
#
# It has to be sysresetreq rather than vectreset, because the point of it on
# this board is the peripherals: the watchdog is what restarts the part every
# eleven seconds, it is off after a reset until firmware enables it, and
# halting the core out of reset means firmware never gets to. vectreset would
# leave the watchdog configured and still counting.
cortex_m reset_config sysresetreq

# OpenOCD 0.12 has no LPC546xx flash driver, but its lpc2000 driver's lpc54100
# variant describes the same part in every respect that matters: it calls IAP
# at 0x03000205, lays 512 KB out as sixteen 32 KB sectors, writes in 256-byte
# units, and puts the boot image's checksum in vector 7. That last one is not
# taken on trust -- the word at 0x1c in this keyboard's own bootloader is the
# two's complement of the seven vectors before it, which is what vector 7 being
# the checksum means.
#
# The clock figure is what IAP uses to time the flash controller, so it has to
# be the clock the part is actually running on. After a reset that is the
# 12 MHz internal oscillator, before any firmware touches the PLL -- so flash
# work is done from "reset halt" and not from --halt-late.
#
# calc_checksum is deliberately absent: it would rewrite the word at 0x1c of
# whatever is written to offset 0, and nothing here writes a boot image.
flash bank $CHIPNAME.flash lpc2000 \
    0x00000000 0x80000 0 0 $CHIPNAME.cpu lpc54100 12000
