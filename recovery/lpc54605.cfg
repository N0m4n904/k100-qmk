#
# NXP LPC54605J512ET100 as fitted to the Corsair K100 RGB.
#
# OpenOCD 0.12 ships no config for the LPC546xx family, so this is the minimum
# that lets a probe attach and read memory. Deliberately nothing here halts,
# resets or writes the part: reading flash goes through the debug access port's
# AHB bridge and does not need the core stopped, which matters on this board
# because the application faults and the watchdog restarts it every few seconds.
# A dump therefore works straight through that loop.

transport select swd

set CHIPNAME lpc54605

# The published Cortex-M4 debug port ID. A board that answers with a different
# one is still worth dumping, so this is not asserted -- see find-swd.sh, which
# accepts any ID while it is still looking for the pins.
swd newdap $CHIPNAME cpu -expected-id 0x2ba01477

dap create $CHIPNAME.dap -chain-position $CHIPNAME.cpu
target create $CHIPNAME.cpu cortex_m -dap $CHIPNAME.dap

# SRAM at 0x20000000, 160 KB. Only flash *writes* need this; a dump does not
# touch it.
$CHIPNAME.cpu configure -work-area-phys 0x20000000 \
                        -work-area-size 0x8000 \
                        -work-area-backup 0

# Reset through the core's own AIRCR.SYSRESETREQ, so no reset line has to be
# wired to use "reset halt".
#
# It has to be sysresetreq rather than vectreset, because the point of it on
# this board is the peripherals: the watchdog is what restarts the part every
# eleven seconds, it is off after a reset until firmware enables it, and
# halting the core out of reset means firmware never gets to. vectreset would
# leave the watchdog configured and still counting.
cortex_m reset_config sysresetreq
