#
# A Raspberry Pi 4 driving SWD directly from its expansion header.
#
# The Pi's GPIOs are 3.3 V and so is the LPC54605, so the two connect with
# nothing in between. The Pi must share a ground with the keyboard.
#
#   header pin 16   GPIO23   nRESET   (optional; see recovery/README.md)
#   header pin 18   GPIO24   SWDIO
#   header pin 20   GND      ground
#   header pin 22   GPIO25   SWCLK
#
# Four consecutive pins on the header's even row, so a 4-way jumper block lands
# on them without counting.
#
# linuxgpiod is used rather than the faster bcm2835gpio because it goes through
# the kernel's GPIO character device instead of mapping /dev/mem, which means it
# does not need to know the SoC's peripheral base address and so cannot be
# pointed at the wrong one. A dump at this speed takes a couple of minutes;
# README.md has the faster variant for anyone who wants it.

adapter driver linuxgpiod

adapter gpio swclk -chip 0 25
adapter gpio swdio -chip 0 24
adapter gpio srst  -chip 0 23

# Slow on purpose. These are unshielded flying leads next to a switching power
# supply and an LED driver; a dump that is right the first time beats a fast one
# that has to be repeated.
adapter speed 100

# nRESET is open-drain on this part, so the adapter may only pull it down.
# srst_nogate keeps the debug port alive while reset is asserted, which is what
# lets a probe attach to a board whose firmware would otherwise run away.
reset_config srst_only srst_open_drain srst_nogate
